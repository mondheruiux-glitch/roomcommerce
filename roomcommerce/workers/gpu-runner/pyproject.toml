[tool.poetry]
name = "gpu-runner"
version = "0.1.0"
description = "RoomCommerce GPU inference pipeline — Depth Anything V2 + SDXL Inpainting + SAM + SigLIP"
authors = ["RoomCommerce Engineering <eng@roomcommerce.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
torch = "2.4.1"
torchvision = "0.19.1"
diffusers = "0.30.3"
transformers = "4.45.2"
accelerate = "0.34.2"
safetensors = "0.4.5"
opencv-python-headless = "4.10.0.84"
pillow = "10.4.0"
modal = ">=0.64.0"
numpy = "1.26.4"
qdrant-client = "1.11.3"
boto3 = "1.35.32"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.6.0"
pytest = ">=8.3.0"
pytest-asyncio = ">=0.24.0"

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B"]

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
