# File: docker-compose.yml
# RoomCommerce — Local Full-Stack Infrastructure
#
# Services provisioned:
#   1. postgres  — PostgreSQL 16 (relational: users, projects, catalog_skus, canvas_hotspots, move_passes)
#   2. redis     — Redis 7 (BullMQ dual-priority queues + auth token cache)
#   3. qdrant    — Qdrant v1.11.3 (768-dim HNSW cosine — retail_catalog_v1 collection)
#   4. r2-local  — MinIO (S3-compatible local emulator for Cloudflare R2 presigned PUT uploads)
#   5. r2-init   — MinIO MC initialiser (auto-creates 'roomcommerce-assets' bucket & CORS)
#
# Usage:
#   pnpm docker:up            # Start all services in detached mode
#   pnpm docker:down          # Stop and remove containers (data volumes preserved)
#   pnpm docker:logs          # Follow combined service logs
#   pnpm local:bootstrap      # Full local stack init: up + db:push + api:seed + preflight

name: roomcommerce-local

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL 16 — Relational Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: roomcommerce-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: roomcommerce
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d roomcommerce"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # 2. Redis 7 — BullMQ Dual-Priority Job Queue & Session / Rate-Limit Cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: roomcommerce-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------------
  # 3. Qdrant v1.11.3 — 768-Dim HNSW Vector Search Engine
  #    Web UI:    http://localhost:6333/dashboard
  #    gRPC API:  localhost:6334
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: roomcommerce-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # 4. MinIO — Local S3 / Cloudflare R2 Emulator
  #    S3 API:       http://localhost:9000
  #    Web Console:  http://localhost:9001  (minioadmin / minioadmin_password)
  # ---------------------------------------------------------------------------
  r2-local:
    image: minio/minio:latest
    container_name: roomcommerce-r2-local
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_password
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # 5. MinIO Bucket Initializer (one-shot)
  #    Creates 'roomcommerce-assets' bucket with anonymous download policy
  # ---------------------------------------------------------------------------
  r2-init:
    image: minio/mc:latest
    container_name: roomcommerce-r2-init
    depends_on:
      r2-local:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://r2-local:9000 minioadmin minioadmin_password;
      mc mb --ignore-existing local/roomcommerce-assets;
      mc anonymous set download local/roomcommerce-assets;
      echo 'MinIO bucket roomcommerce-assets ready';
      exit 0;
      "

# ---------------------------------------------------------------------------
# Named Volumes — data persists across docker compose down (use -v to wipe)
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  minio_data:
    driver: local
